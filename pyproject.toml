[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkage-lab"
version = "0.1.0"
description = "Historical record linkage portfolio project: standardisation, blocking, rule-based/ML linkage, one-to-one constrained assignment, benchmark evaluation, life-course/entity resolution, and an experimental local-LLM supplement, demonstrated on a synthetic benchmark and a real-world NYC city directory case study."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "networkx>=3.0",
    "jellyfish>=1.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "joblib>=1.3",
    "requests>=2.28",
    "sklearn-crfsuite>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "snakemake>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
