[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkage-lab"
version = "0.1.0"
description = "Prototype for historical record linkage on synthetic data (standardisation, blocking, rule-based/ML linkage, benchmark evaluation, life-course construction)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "jellyfish>=1.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "snakemake>=8.0"]
llm = ["anthropic>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]
